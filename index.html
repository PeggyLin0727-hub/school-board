<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>班級公告與財務專區</title>
    <!-- 沿用原本的 style.css -->
    <link rel="stylesheet" href="style.css">
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Font Awesome 圖示庫 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- 頂部標題（已移除管理者登入按鈕） -->
    <div class="top-header-bar" style="justify-content: center;">
        <h1 id="class-title-header">班級資訊專區</h1>
    </div>

    <!-- 正常內容區塊（預設隱藏，待驗證 UID 後顯示） -->
    <div id="main-content-card" class="card hidden">
        <!-- 主頁籤：家長只有 公告 與 財務 -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('announcement')">班級公告</button>
            <button class="tab-btn" onclick="switchTab('financial')">財務收支</button>
        </div>

        <!-- 公告檢視區塊 -->
        <div id="ann-section" class="tab-content active">
            <h3>班級公告列表</h3>
            <div id="parent-ann-list" style="margin-top: 15px;"></div>
        </div>

        <!-- 財務檢視區塊 -->
        <div id="fin-section" class="tab-content">
            <div style="margin-bottom: 12px;">
                <select id="semester-select" onchange="loadFinancialData()">
                    <option value="">-- 全部學期 --</option>
                </select>
            </div>
            
            <div id="fin-summary" class="fin-summary-box"></div>
            
            <div class="sub-tab-pill-container" style="margin-top: 15px;">
                <button id="pill-rec" class="sub-pill-btn active" onclick="switchFinSub('rec')">收支明細</button>
                <button id="pill-rcp" class="sub-pill-btn" onclick="switchFinSub('rcp')">發票與憑證</button>
            </div>

            <div id="fin-rec-view">
                <h3>收支金額明細</h3>
                <div id="parent-fin-rec-list" style="margin-top: 15px;"></div>
            </div>

            <div id="fin-rcp-view" class="hidden">
                <h3>發票與收據憑證</h3>
                <div id="parent-fin-rcp-list" style="margin-top: 15px;"></div>
            </div>
        </div>
    </div>

    <!-- 404 錯誤提示畫面（當未提供 uid 或 uid 錯誤時顯示） -->
    <div id="error-404-card" class="card hidden" style="text-align: center; padding: 50px 20px;">
        <i class="fa-solid fa-triangle-exclamation" style="font-size: 48px; color: #ff4d4f; margin-bottom: 16px;"></i>
        <h2 style="margin-bottom: 10px; color: #1e293b;">404 - 找不到網頁</h2>
    </div>

    <script>
        const SUPABASE_URL = 'https://otiyidlbqhypwqoafbgi.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_-QXTZjRq3Gsh4gOa1sUeHA_ahrsoFFe';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // 取得網址列的 ?uid= 參數
        const urlParams = new URLSearchParams(window.location.search);
        const CLASS_UID = urlParams.get('uid');

        let currentFinSub = 'rec';

        function switchTab(type) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('ann-section').classList.toggle('active', type === 'announcement');
            document.getElementById('fin-section').classList.toggle('active', type === 'financial');
            event.target.classList.add('active');
            if (type === 'announcement') loadAnnouncements();
            else loadFinancialData();
        }

        function switchFinSub(sub) {
            currentFinSub = sub;
            document.getElementById('pill-rec').classList.toggle('active', sub === 'rec');
            document.getElementById('pill-rcp').classList.toggle('active', sub === 'rcp');
            document.getElementById('fin-rec-view').classList.toggle('hidden', sub !== 'rec');
            document.getElementById('fin-rcp-view').classList.toggle('hidden', sub !== 'rcp');
            loadFinancialData();
        }

        // 初始化檢查：若沒有 uid 則顯示 404 畫面
        async function initPage() {
            if (!CLASS_UID) {
                document.getElementById('error-404-card').classList.remove('hidden');
                return;
            }

            // 驗證資料庫中是否有這個班級
            const { data, error } = await supabaseClient.from('classes').select('name, academic_year').eq('uid', CLASS_UID).single();
            
            if (error || !data) {
                document.getElementById('error-404-card').classList.remove('hidden');
                return;
            }

            // 驗證成功，顯示正常內容並載入資料
            document.getElementById('main-content-card').classList.remove('hidden');
            document.getElementById('class-title-header').textContent = `${data.academic_year}學年度 ${data.name} 班級資訊專區`;

            await initSemesters();
            await loadAnnouncements();
        }

        // 載入公告列表
        async function loadAnnouncements() {
            const listEl = document.getElementById('parent-ann-list');
            listEl.innerHTML = '<div style="text-align:center; color:#888; padding:20px;">資料載入中...</div>';
            
            const { data } = await supabaseClient
                .from('announcements')
                .select(`uid, name, note, attachment_url, is_pinned, announcement_categories ( name, color )`)
                .eq('class_uid', CLASS_UID)
                .order('is_pinned', { ascending: false })
                .order('created_at', { ascending: false });

            listEl.innerHTML = '';
            if (data && data.length > 0) {
                data.forEach(item => {
                    const catName = item.announcement_categories ? item.announcement_categories.name : '一般';
                    const catColor = item.announcement_categories ? item.announcement_categories.color : '#64748b';
                    const pinBadge = item.is_pinned ? `<span class="pin-tag">置頂</span>` : '';
                    let imgHtml = item.attachment_url ? `<div style="margin-top:8px;"><a href="${item.attachment_url}" target="_blank"><img src="${item.attachment_url}" style="max-height:150px; border-radius:6px; border:1px solid #ddd;"></a></div>` : '';

                    listEl.innerHTML += `
                        <div class="custom-card-item" style="flex-direction: column; align-items: stretch;">
                            <div style="display: flex; justify-content: space-between; align-items: center;">
                                <div class="card-title">${pinBadge}${item.name}</div>
                                <span class="category-badge" style="background-color: ${catColor};">${catName}</span>
                            </div>
                            <div class="card-sub" style="margin-top: 8px; white-space: pre-wrap; color: #333;">${item.note || ''}</div>
                            ${imgHtml}
                        </div>
                    `;
                });
            } else {
                listEl.innerHTML = `<div style="text-align: center; color: #888; padding: 20px;">目前尚無公告資料</div>`;
            }
        }

        // 載入學期選單
        async function initSemesters() {
            const semSelect = document.getElementById('semester-select');
            const { data } = await supabaseClient.from('semesters').select('*').order('sort_order', { ascending: true });
            semSelect.innerHTML = '<option value="">-- 全部學期 --</option>';
            if (data) {
                data.forEach(s => {
                    semSelect.innerHTML += `<option value="${s.uid}">${s.name}</option>`;
                    if (s.is_default) semSelect.value = s.uid;
                });
            }
        }

        // 載入財務收支明細與憑證
        async function loadFinancialData() {
            const semUid = document.getElementById('semester-select').value;
            
            let query = supabaseClient.from('financial_records').select(`uid, name, remark, date, amount, type`).eq('class_uid', CLASS_UID).order('created_at', { ascending: false });
            if (semUid) query = query.eq('semester_uid', semUid);
            const { data: records } = await query;

            const { data: allRecords } = await supabaseClient.from('financial_records').select('amount, type').eq('class_uid', CLASS_UID);
            let totalInc = 0, totalExp = 0, curInc = 0, curExp = 0;
            if (allRecords) {
                allRecords.forEach(r => {
                    const amt = Number(r.amount) || 0;
                    if (Number(r.type) === 1) totalInc += amt; else totalExp += amt;
                });
            }
            
            const recListEl = document.getElementById('parent-fin-rec-list');
            recListEl.innerHTML = '';
            if (records && records.length > 0) {
                records.forEach(item => {
                    const isInc = Number(item.type) === 1;
                    const amt = Number(item.amount) || 0;
                    if (isInc) curInc += amt; else curExp += amt;
                    const badge = isInc ? `<span class="type-badge inc">收入</span>` : `<span class="type-badge exp">支出</span>`;

                    recListEl.innerHTML += `
                        <div class="custom-card-item">
                            <div class="card-info" style="flex:1;">
                                <div class="card-title">${badge} <span>${item.name}</span></div>
                                <div class="card-sub" style="margin-top: 4px;">日期: ${item.date || ''} ${item.remark ? '| 備註: ' + item.remark : ''}</div>
                            </div>
                            <div style="color: ${isInc ? '#00b96b' : '#ff4d4f'}; font-weight: bold; font-size: 16px;">
                                ${isInc ? '+' : '-'}$${amt.toLocaleString()}
                            </div>
                        </div>
                    `;
                });
            } else {
                recListEl.innerHTML = `<div style="text-align: center; color: #888; padding: 20px;">目前尚無收支明細</div>`;
            }

            const balance = curInc - curExp;
            const totalBalance = totalInc - totalExp;
            document.getElementById('fin-summary').innerHTML = `
                <div class="summary-item"><span class="summary-label">收入:</span><span class="inc">+$${curInc.toLocaleString()}</span></div>
                <div class="summary-item"><span class="summary-label">支出:</span><span class="exp">-$${curExp.toLocaleString()}</span></div>
                <div class="summary-item"><span class="summary-label">結餘:</span><span class="balance" style="color: ${balance >= 0 ? '#00b96b' : '#ff4d4f'}">$${balance.toLocaleString()}</span></div>
                <div class="summary-item"><span class="summary-label">總餘:</span><span class="total-balance" style="color: ${totalBalance >= 0 ? '#00b96b' : '#ff4d4f'}">$${totalBalance.toLocaleString()}</span></div>
            `;

            let rcpQuery = supabaseClient.from('financial_receipts').select(`uid, receipt_url, remark`).eq('class_uid', CLASS_UID).order('created_at', { ascending: false });
            if (semUid) rcpQuery = rcpQuery.eq('semester_uid', semUid);
            const { data: receipts } = await rcpQuery;

            const rcpListEl = document.getElementById('parent-fin-rcp-list');
            rcpListEl.innerHTML = '';
            if (receipts && receipts.length > 0) {
                receipts.forEach(item => {
                    rcpListEl.innerHTML += `
                        <div class="custom-card-item">
                            <div style="display: flex; gap: 14px; align-items: center;">
                                <a href="${item.receipt_url}" target="_blank">
                                    <img src="${item.receipt_url}" style="width: 60px; height: 60px; object-fit: cover; border-radius: 6px; border: 1px solid #ddd;">
                                </a>
                                <div class="card-info">
                                    <div class="card-title">憑證收據</div>
                                    <div class="card-sub">${item.remark ? '備註: ' + item.remark : '無備註'}</div>
                                </div>
                            </div>
                        </div>
                    `;
                });
            } else {
                rcpListEl.innerHTML = `<div style="text-align: center; color: #888; padding: 20px;">目前尚無憑證收據</div>`;
            }
        }

        // 頁面載入時執行檢查
        initPage();
    </script>
</body>
</html>
