<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>班級公告與財務專區</title>
    <!-- 沿用原本的 style.css -->
    <link rel="stylesheet" href="style.css?v=261024">
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Font Awesome 圖示庫 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- 頂部標題（已移除管理者登入按鈕） -->
    <div class="top-header-bar" style="justify-content: center;">
        <h1 id="class-title-header">班級資訊專區</h1>
    </div>

    <!-- 正常內容區塊（預設隱藏，待驗證 UID 後顯示） -->
    <div id="main-content-card" class="card hidden">
        <!-- 主頁籤：家長只有 公告 與 財務 -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('announcement')">班級公告</button>
            <button class="tab-btn" onclick="switchTab('financial')">財務收支</button>
        </div>

        <!-- 公告檢視區塊 -->
        <div id="ann-section" class="tab-content active">
            <h3>班級公告列表</h3>
            <div id="parent-ann-list" style="margin-top: 15px;"></div>
        </div>

        <!-- 財務檢視區塊 -->
        <div id="fin-section" class="tab-content">
            <div style="margin-bottom: 12px;">
                <select id="semester-select" onchange="loadFinancialData()">
                    <option value="">-- 全部學期 --</option>
                </select>
            </div>
            
            <div id="fin-summary" class="fin-summary-box"></div>
            
            <div class="sub-tab-pill-container" style="margin-top: 15px;">
                <button id="pill-rec" class="sub-pill-btn active" onclick="switchFinSub('rec')">收支明細</button>
                <button id="pill-rcp" class="sub-pill-btn" onclick="switchFinSub('rcp')">發票與憑證</button>
            </div>

            <div id="fin-rec-view">
                <h3>收支金額明細</h3>
                <div id="parent-fin-rec-list" style="margin-top: 15px;"></div>
            </div>

            <div id="fin-rcp-view" class="hidden">
                <h3>發票與收據憑證</h3>
                <div id="parent-fin-rcp-list" style="margin-top: 15px;"></div>
            </div>
        </div>
    </div>

    <!-- 404 錯誤提示畫面（當未提供 uid 或 uid 錯誤時顯示） -->
    <div id="error-404-card" class="card hidden" style="text-align: center; padding: 50px 20px;">
        <i class="fa-solid fa-triangle-exclamation" style="font-size: 48px; color: #ff4d4f; margin-bottom: 16px;"></i>
        <h2 style="margin-bottom: 10px; color: #1e293b;">404 - 找不到網頁</h2>
    </div>

    <!-- 圖片大圖預覽 Modal -->
    <div id="image-preview-modal" class="modal-overlay hidden" onclick="closeImagePreviewModal()">
        <div class="image-preview-card" onclick="event.stopPropagation()">
            <button type="button" class="dp-x-btn image-preview-close-btn" onclick="closeImagePreviewModal()">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <img id="image-preview-modal-img" src="" alt="圖片大圖預覽">
        </div>
    </div>

    <script src="app.js?v=261024"></script>
    <script src="script.js?v=261024"></script>
</body>
</html>
